name: CI

# Run on every push to any branch and on every pull request targeting `main`.
# This is the gate every change must pass before merging — it builds every
# supported platform, runs the test suite, and lints with clippy.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 5
  RUSTUP_MAX_RETRIES: 5
  # Android-x86 9.0-r2 (Pie) — stable, widely-tested, ~900 MB ISO. Used as
  # the default bundled image. The URL points at the primary Android-x86
  # mirror; if it's down, the build retries with exponential backoff.
  ANDROID_X86_VERSION: "9.0-r2"
  ANDROID_X86_URL: "https://dl.android-x86.org/9.0-r2/android-x86_64-9.0-r2.iso"

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Lint + format check — fast, runs first to fail early on trivial issues.
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ──────────────────────────────────────────────────────────────────────
  # Linux build (Ubuntu 22.04) — produces a portable binary + bundled ISO.
  # ──────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libgbm-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            vulkan-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace (release)
        run: cargo build --release --workspace

      - name: Run tests
        run: cargo test --workspace --release

      - name: Smoke check (headless instance listing)
        run: ./target/release/nitroid --list

      - name: Download Android-x86 system image
        run: |
          mkdir -p artifacts/linux
          echo "Downloading $ANDROID_X86_URL ..."
          # Retry with exponential backoff — the Android-x86 mirror can be
          # flaky. 5 attempts, 30s initial backoff, doubling each time.
          curl --fail --location --retry 5 --retry-delay 30 \
               --connect-timeout 60 --max-time 3600 \
               -o artifacts/linux/android.iso \
               "$ANDROID_X86_URL"
          ls -lh artifacts/linux/android.iso
          # Verify it's a real ISO (magic bytes: 0x43 0x44 0x30 0x30 = "CD00")
          xxd -l 8 artifacts/linux/android.iso | head -1
          # The ISO 9660 magic is at offset 0x8001-0x8004 ("CD001")
          dd if=artifacts/linux/android.iso bs=1 skip=32769 count=5 2>/dev/null | xxd

      - name: Package binary + ISO
        run: |
          cp target/release/nitroid artifacts/linux/
          cp README.md LICENSE-MIT LICENSE-APACHE artifacts/linux/
          # Write a manifest so the runtime knows an image is bundled.
          cat > artifacts/linux/bundled-image.json <<'EOF'
          {
            "name": "Android-x86 9.0 (Pie)",
            "version": "9.0-r2",
            "filename": "android.iso",
            "vendor": "Android-x86 Project",
            "arch": "x86_64",
            "bundled": true
          }
          EOF
          cd artifacts/linux && tar czf ../../nitroid-linux-x86_64.tar.gz .
          cd ../..
          ls -lh nitroid-linux-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitroid-linux-x86_64
          path: artifacts/linux/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # Windows build — produces a .exe with no required runtime DLLs + ISO.
  # ──────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace (release)
        run: cargo build --release --workspace

      - name: Run tests
        run: cargo test --workspace --release

      - name: Smoke check
        run: ./target/release/nitroid.exe --list

      - name: Download Android-x86 system image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows
          Write-Host "Downloading $env:ANDROID_X86_URL ..."
          # PowerShell's Invoke-WebRequest with retries
          $ProgressPreference = 'SilentlyContinue'
          $retries = 5
          $delay = 30
          for ($i = 1; $i -le $retries; $i++) {
            try {
              Invoke-WebRequest -Uri $env:ANDROID_X86_URL -OutFile artifacts\windows\android.iso -TimeoutSec 3600
              break
            } catch {
              Write-Host "Attempt $i failed: $_"
              if ($i -eq $retries) { throw $_ }
              Start-Sleep -Seconds $delay
              $delay *= 2
            }
          }
          Get-ChildItem artifacts\windows\android.iso | Format-List

      - name: Package binary + ISO
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows
          Copy-Item target\release\nitroid.exe artifacts\windows\
          Copy-Item README.md artifacts\windows\
          Copy-Item LICENSE-MIT artifacts\windows\
          Copy-Item LICENSE-APACHE artifacts\windows\
          # Write a manifest so the runtime knows an image is bundled.
          @'
          {
            "name": "Android-x86 9.0 (Pie)",
            "version": "9.0-r2",
            "filename": "android.iso",
            "vendor": "Android-x86 Project",
            "arch": "x86_64",
            "bundled": true
          }
          '@ | Out-File -FilePath artifacts\windows\bundled-image.json -Encoding utf8
          Compress-Archive -Path artifacts\windows\* -DestinationPath nitroid-windows-x86_64.zip
          Get-ChildItem nitroid-windows-x86_64.zip | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nitroid-windows-x86_64
          path: artifacts\windows\
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # Release — only runs when a tag starting with `v` is pushed. Uploads
  # platform-specific archives (now including the bundled Android image)
  # to the GitHub release.
  # ──────────────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create archives
        run: |
          mkdir -p release
          tar czf release/nitroid-${{ github.ref_name }}-linux-x86_64.tar.gz -C artifacts/nitroid-linux-x86_64 .
          cd artifacts/nitroid-windows-x86_64 && zip -r ../../release/nitroid-${{ github.ref_name }}-windows-x86_64.zip . && cd ../..
          ls -la release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nitroid ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/nitroid-${{ github.ref_name }}-linux-x86_64.tar.gz
            release/nitroid-${{ github.ref_name }}-windows-x86_64.zip
          body: |
            ## Nitroid ${{ github.ref_name }}

            ### Downloads (now with bundled Android image!)

            - **Linux x86_64**: `nitroid-${{ github.ref_name }}-linux-x86_64.tar.gz` (~900 MB)
            - **Windows x86_64**: `nitroid-${{ github.ref_name }}-windows-x86_64.zip` (~900 MB)

            Each archive contains:
            - The Nitroid binary (`nitroid` / `nitroid.exe`)
            - A pre-bundled Android-x86 9.0-r2 ISO (`android.iso`)
            - A `bundled-image.json` manifest
            - License files

            ### Install (Linux)
            ```bash
            tar xzf nitroid-${{ github.ref_name }}-linux-x86_64.tar.gz
            ./nitroid
            ```
            On first run, Nitroid detects the bundled `android.iso` and auto-registers it —
            no manual download needed.

            ### Install (Windows)
            Extract the zip and double-click `nitroid.exe`.

            ### Requirements
            - **Linux**: KVM enabled (`/dev/kvm`), Vulkan-capable GPU
            - **Windows**: Hyper-V / WHPX enabled, DX12-capable GPU
