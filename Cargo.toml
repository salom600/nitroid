[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/virtualization",
    "crates/graphics",
    "crates/translation",
    "crates/input",
    "crates/instances",
    "crates/ui",
    "crates/bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["salom600"]
repository = "https://github.com/salom600/nitroid"
description = "Ultra-light, high-performance Android emulator built in Rust"
keywords = ["android", "emulator", "kvm", "whpx", "wgpu"]
categories = ["emulators", "virtualization"]

[workspace.dependencies]
# Core utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
parking_lot = "0.12"
crossbeam-channel = "0.5"
once_cell = "1.19"
dashmap = "6.0"

# Async
tokio = { version = "1.40", features = ["full"] }

# Graphics
wgpu = "22.0"
raw-window-handle = "0.6"
pollster = "0.3"

# UI
egui = "0.28"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.28", features = ["image"] }

# Image / asset
image = { version = "0.25", default-features = false, features = ["png"] }

# Cryptographic hashing for instance fingerprinting
blake3 = "1.5"

# Compression for snapshots
zstd = "0.13"

# Directories
directories = "5.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true

[profile.bench]
opt-level = 3
lto = "thin"
