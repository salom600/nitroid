# cargo-deny configuration — checks licence compatibility and known-broken
# crate versions. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Deny any advisory. CI will fail if a known-vulnerable version is in the tree.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Allow these permissive licences. We deny GPL/AGPL to keep the binary
# redistributable under a permissive licence.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
# Warn on duplicate versions (we'd like to avoid the "two versions of tokio"
# situation), but don't fail the build.
multiple-versions = "warn"
deny = []
skip = []
skip-tree = []

[sources]
# Don't allow crates from unknown registries or git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
